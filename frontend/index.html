<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reflex - Delivery Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="card landing-card">
      <h2 style="text-align: center; margin-bottom: 0.5rem; color: var(--primary-color);">Reflex</h2>
      <p style="text-align: center; color: var(--text-muted); margin-bottom: 2rem;">Select a Persona to Start Demo</p>

      <!-- Connection Status indicator -->
      <div id="connection-status-container" style="margin-bottom: 1.5rem; display: flex; justify-content: center;"></div>

      <div class="form-group">
        <label>Select Role</label>

        <div class="role-option" id="role-retailer" onclick="selectRole('retailer_staff')">
          <div>
            <div class="role-title">Retailer Staff</div>
            <div class="role-desc">Creates and tracks delivery requests</div>
          </div>
        </div>

        <div class="role-option" id="role-dispatcher" onclick="selectRole('dispatcher')">
          <div>
            <div class="role-title">Dispatcher</div>
            <div class="role-desc">Assigns riders to requested deliveries</div>
          </div>
        </div>

        <div class="role-option" id="role-rider" onclick="selectRole('rider')">
          <div>
            <div class="role-title">Rider</div>
            <div class="role-desc">Picks up and delivers orders using confirmation codes</div>
          </div>
        </div>
      </div>

      <div class="form-group" id="user-selection-group" style="display: none;">
        <label for="user-select">Select Active User Profile</label>
        <select id="user-select" class="form-control" onchange="onUserChanged()">
          <option value="">-- Choose User --</option>
        </select>
        <div id="user-details-tip" style="margin-top: 0.5rem; font-size: 0.8rem; color: var(--text-muted);"></div>
      </div>

      <button id="proceed-btn" class="btn btn-primary" style="margin-top: 1.5rem;" disabled onclick="proceedToUI()">
        Proceed to Interface
      </button>
    </div>
  </div>

  <!-- Scripts -->
   <script src="config.js"></script>
  <script src="api.js"></script>
  <script src="script.js"></script>
</body>
</html>
